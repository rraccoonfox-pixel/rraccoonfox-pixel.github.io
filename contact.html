<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Elizabet Gubert</title>

    <!-- Bootstrap: готовые стили навигации и отступов. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Общий CSS для всех страниц портфолио. -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="contact-page">

    <!-- Декоративный фон. aria-hidden скрывает его от программы чтения экрана. -->
    <div class="contact-background" aria-hidden="true"></div>

    <!-- Bootstrap container: ограничивает ширину и добавляет боковые отступы. -->
    <div class="container">

        <header>
            <!-- Bootstrap navbar: оформление навигации. -->
            <nav class="navbar navbar-expand" aria-label="Main navigation">

                <a class="navbar-brand" href="index.html">eg.</a>

                <!-- ms-auto: сдвигает меню вправо. -->
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>

                    <li class="nav-item">
                        <!-- aria-current: сообщает, что эта страница открыта. -->
                        <a class="nav-link active"
                           href="contact.html"
                           aria-current="page">Contact</a>
                    </li>
                </ul>
            </nav>
        </header>

        <main class="contact-content">

            <h1>Let’s connect</h1>

            <hr>

            <p class="contact-intro">
                For questions about my work, creative collaborations,
                or exhibition opportunities, please contact me by email.
            </p>

                        <!-- mailto: открывает почтовое приложение с моим адресом. -->
            <a class="contact-email"
               href="mailto:elizabetgubert@gmail.com">
                elizabetgubert@gmail.com
            </a>

            <!-- Bootstrap mt-3: отступ над ссылкой LinkedIn. -->
            <p class="mt-3">
    <a class="contact-email" href="https://www.linkedin.com/in/elizabet-gubert-4264341b1/"
       target="_blank"
       rel="noopener noreferrer">
        Elizabet Gubert on LinkedIn ↗
    </a>
</p>
        </main>

        <!-- Bootstrap py-4: внутренние отступы сверху и снизу. -->
        <footer class="contact-footer py-4">
            <a href="index.html">Back to Projects</a>
        </footer>

    </div>

</body>
</html>
