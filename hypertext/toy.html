<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What You Love</title>

  <style>
    body {
      background-color: #f7f3ea;
      background-image: url("background.gif");

      /* Fills the window; some edges may be cropped */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      /* Keeps the background in place while scrolling */
      background-attachment: fixed;

      color: #29251f;
      font-family: Georgia, serif;
      margin: 30px;
    }

    .text-box {
      background-color: #f7f3ea;
      padding: 25px;
      max-width: 700px;

      /* Centers the box horizontally */
      margin: auto;

      text-align: center;
    }

    a {
      color: #29251f;
    }

    img {
      /* Fits smaller screens while keeping the image proportions */
      max-width: 100%;
      height: auto;
    }
  </style>
</head>

<body>
  <div class="text-box">
    <h1>It is not useful.</h1>

    <img
      src="toy.png"
      alt="A plush bear"
      width="400">

    <p>You still want it with you.</p>

    <p><a href="make-room.html">Take it</a></p>
    <p><a href="left-behind.html">Leave it</a></p>
  </div>
</body>
</html>
